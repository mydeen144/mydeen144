<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 300" width="1600" height="300" role="img" aria-labelledby="t"><title id="t">02 STACK. Tools I trust.</title><style>
.a{animation-duration:.9s;animation-timing-function:cubic-bezier(.16,1,.3,1);animation-fill-mode:both}
.rise{animation-name:rise;transform-box:fill-box;transform-origin:0 100%}
.up{animation-name:up}
.fade{animation-name:fade}
.draw{animation-name:draw;transform-box:fill-box;transform-origin:0 50%;animation-timing-function:cubic-bezier(.65,0,.35,1);animation-duration:1.2s}
.mark{animation-name:draw;transform-box:fill-box;transform-origin:0 50%;animation-timing-function:cubic-bezier(.65,0,.35,1);animation-duration:.8s}
.pop{animation-name:pop;transform-box:fill-box;transform-origin:50% 50%}
.spin{animation-name:spin;transform-box:fill-box;transform-origin:50% 50%;animation-duration:1.8s}
.grow{animation-name:grow;transform-box:fill-box;transform-origin:50% 100%}
.roll{animation-name:roll;animation-duration:1.6s}
.flip{animation-name:flip;animation-duration:.5s;animation-timing-function:ease}
.slide{animation-name:slide;animation-duration:1.1s}
.ping{animation:ping 1.8s cubic-bezier(.16,1,.3,1) infinite;transform-box:fill-box;transform-origin:50% 50%}
.drip{animation:drip 1.8s cubic-bezier(.65,0,.35,1) infinite}
@keyframes rise{from{transform:translateY(118%) rotate(4deg)}}
@keyframes up{from{opacity:0;transform:translateY(28px)}}
@keyframes fade{from{opacity:0}}
@keyframes draw{from{transform:scaleX(0)}}
@keyframes pop{from{transform:scale(0) rotate(-90deg)}}
@keyframes spin{from{transform:rotate(-200deg);opacity:0}}
@keyframes grow{from{transform:scaleY(0)}}
@keyframes roll{from{transform:translateY(var(--d))}}
@keyframes flip{from{fill:var(--from)}}
@keyframes slide{from{transform:translate(var(--sx),var(--sy));opacity:0}}
@keyframes ping{from{transform:scale(1);opacity:.7}to{transform:scale(3.2);opacity:0}}
@keyframes drip{from{transform:translateY(-60px)}to{transform:translateY(90px)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
